<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the TaM integration for Gladys Assistant (illustration, not
       the logo of the TaM nor of Montpellier Méditerranée Métropole).
       Montpellier at dusk: the Arc de triomphe of the Peyrou, plane trees, a
       blue tram of line 1 with its white swallows, and a screen of the stop
       announcing the next departures with a delay. The line colours are the
       ones of the GTFS of the TaM. Built into cover.jpg by
       scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b7fb8"/>
      <stop offset="0.5" stop-color="#c9d6ea"/>
      <stop offset="1" stop-color="#f7d9b5"/>
    </linearGradient>
    <linearGradient id="tram" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b6fc2"/>
      <stop offset="1" stop-color="#004a8a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4e66"/>
      <stop offset="1" stop-color="#1d2a3a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a24"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
    <path id="swallow" d="M0 0 C6 -4 10 -4 14 0 C18 -4 22 -4 28 0 C22 -1 18 1 16 5 L14 9 L12 5 C10 1 6 -1 0 0 Z" fill="#ffffff"/>
  </defs>
  <rect width="800" height="534" fill="url(#sky)"/>
  <circle cx="660" cy="250" r="46" fill="#ffe2b0" opacity="0.8"/>

  <!-- the Arc de triomphe of the Peyrou, the Garrigue behind -->
  <path d="M0 300 L120 268 L260 284 L420 262 L560 280 L700 258 L800 272 L800 330 L0 330 Z" fill="#9aa9bd"/>
  <g fill="#d9c7a8" stroke="#a8916c" stroke-width="2">
    <rect x="470" y="168" width="170" height="150"/>
    <rect x="462" y="152" width="186" height="20"/>
    <rect x="474" y="138" width="162" height="16"/>
  </g>
  <path d="M528 318 L528 236 A27 27 0 0 1 582 236 L582 318 Z" fill="#7d8ea6"/>
  <g fill="#c9b591">
    <rect x="484" y="186" width="10" height="120"/>
    <rect x="616" y="186" width="10" height="120"/>
  </g>

  <!-- plane trees and the town -->
  <path d="M0 330 L0 296 L50 296 L50 280 L110 280 L110 296 L190 296 L190 284 L260 284 L260 304 L320 304 L320 286 L400 286 L400 330 Z" fill="#b4bfcc"/>
  <g fill="#5f7a52">
    <ellipse cx="70" cy="268" rx="52" ry="34"/>
    <ellipse cx="200" cy="262" rx="58" ry="38"/>
    <ellipse cx="740" cy="270" rx="56" ry="36"/>
  </g>
  <g fill="#6e5a46">
    <rect x="66" y="290" width="8" height="40"/>
    <rect x="196" y="290" width="8" height="40"/>
    <rect x="736" y="296" width="8" height="34"/>
  </g>
  <rect x="0" y="330" width="800" height="204" fill="#a39886"/>
  <rect x="0" y="392" width="800" height="6" fill="#7f7564"/>
  <rect x="0" y="404" width="800" height="4" fill="#7f7564"/>

  <!-- the tram of line 1: blue, with its white swallows -->
  <g transform="translate(330 318)">
    <rect x="0" y="0" width="440" height="72" rx="14" fill="url(#tram)"/>
    <g fill="url(#glass)">
      <rect x="14" y="14" width="36" height="28" rx="6"/>
      <rect x="60" y="14" width="64" height="28" rx="4"/>
      <rect x="134" y="14" width="64" height="28" rx="4"/>
      <rect x="208" y="14" width="64" height="28" rx="4"/>
      <rect x="282" y="14" width="64" height="28" rx="4"/>
      <rect x="356" y="14" width="64" height="28" rx="4"/>
    </g>
    <use href="#swallow" x="70" y="50"/>
    <use href="#swallow" x="118" y="56"/>
    <use href="#swallow" x="170" y="48"/>
    <use href="#swallow" x="226" y="55"/>
    <use href="#swallow" x="282" y="49"/>
    <use href="#swallow" x="336" y="56"/>
    <use href="#swallow" x="388" y="50"/>
    <line x1="220" y1="0" x2="240" y2="-30" stroke="#2f3a48" stroke-width="3"/>
    <line x1="240" y1="-30" x2="270" y2="-30" stroke="#2f3a48" stroke-width="3"/>
  </g>
  <line x1="0" y1="288" x2="800" y2="288" stroke="#2f3a48" stroke-width="1.5"/>

  <!-- the screen of the stop -->
  <g transform="translate(40 362)">
    <rect x="0" y="0" width="420" height="150" rx="14" fill="url(#screen)"/>
    <rect x="0" y="0" width="420" height="150" rx="14" fill="none" stroke="#3a4352" stroke-width="3"/>
    <g font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold">
      <rect x="20" y="20" width="40" height="26" rx="13" fill="#005ca9"/>
      <text x="40" y="40" font-size="17" fill="#ffffff" text-anchor="middle">1</text>
      <text x="72" y="40" font-size="19" fill="#e8eef6">Gare Sud France</text>
      <text x="400" y="40" font-size="22" fill="#ffd166" text-anchor="end">3 min</text>
      <rect x="20" y="62" width="40" height="26" rx="13" fill="#ef7d00"/>
      <text x="40" y="82" font-size="17" fill="#ffffff" text-anchor="middle">2</text>
      <text x="72" y="82" font-size="19" fill="#e8eef6">Jacou</text>
      <text x="400" y="82" font-size="22" fill="#ffd166" text-anchor="end">5 min</text>
      <rect x="20" y="104" width="40" height="26" rx="13" fill="#c8d400"/>
      <text x="40" y="124" font-size="17" fill="#13263d" text-anchor="middle">3</text>
      <text x="72" y="124" font-size="19" fill="#e8eef6">Juvignac</text>
      <text x="300" y="124" font-size="16" fill="#ff9f43">+2</text>
      <text x="400" y="124" font-size="22" fill="#ffd166" text-anchor="end">9 min</text>
    </g>
  </g>

  <!-- title -->
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="40" y="92" font-size="58" font-weight="bold" fill="#13263d">TaM Montpellier</text>
    <text x="42" y="136" font-size="25" fill="#1d3550">Tram &amp; bus · temps réel · retards · trafic</text>
    <text x="42" y="172" font-size="22" fill="#2a4766">pour Gladys Assistant</text>
  </g>
</svg>
